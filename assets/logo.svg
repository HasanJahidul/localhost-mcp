<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#26a641"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- terminal window chrome -->
  <rect x="56" y="80" width="400" height="320" rx="20" ry="20" fill="#0a0e14" stroke="#30363d" stroke-width="3"/>
  <circle cx="92" cy="116" r="9" fill="#ff5f56"/>
  <circle cx="124" cy="116" r="9" fill="#ffbd2e"/>
  <circle cx="156" cy="116" r="9" fill="#27c93f"/>
  <line x1="56" y1="148" x2="456" y2="148" stroke="#30363d" stroke-width="2"/>

  <!-- prompt + port text -->
  <text x="92" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="64" font-weight="700" fill="url(#accent)">$</text>
  <text x="148" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="64" font-weight="700" fill="#e6edf3">:3000</text>

  <!-- second line: status -->
  <text x="92" y="320" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="36" font-weight="600" fill="#7d8590">PID 48211</text>

  <!-- kill X overlay -->
  <g transform="translate(372 296)">
    <circle r="44" fill="#da3633" stroke="#0a0e14" stroke-width="6"/>
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="-18" y2="18" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- bottom label -->
  <text x="256" y="460" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#e6edf3" text-anchor="middle">localhost-mcp</text>
</svg>
