<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- logo, left -->
  <image xlink:href="logo.svg" x="96" y="100" width="440" height="440"/>

  <!-- text block, right -->
  <text x="600" y="232" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="700" letter-spacing="3" fill="#7d8590">MCP SERVER</text>
  <text x="600" y="312" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#e6edf3">localhost-mcp</text>
  <text x="600" y="372" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#adbac7">Inspect, manage, and kill local dev servers.</text>
  <text x="600" y="414" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#adbac7">Stop guessing what's on :3000.</text>

  <!-- tool chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" font-weight="600">
    <rect x="600" y="456" width="200" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="616" y="481" fill="#3fb950">list_dev_servers</text>
    <rect x="814" y="456" width="142" height="38" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="830" y="481" fill="#d29922">port_info</text>
    <rect x="970" y="456" width="168" height="38" rx="8" fill="#3d1418" stroke="#f85149"/>
    <text x="986" y="481" fill="#ff7b72">kill_server</text>
  </g>

  <text x="600" y="540" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#7d8590">npm i -g localhost-mcp  ·  MIT  ·  lsof + ps  ·  kill is dry-run by default</text>
</svg>
